<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful 15-puzzle sliding tile game. Arrange the tiles in order by sliding them into the empty space.">
    <title>15 Puzzle — Sliding Tile Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Animated background orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                <span class="logo-icon">🧩</span>
                <h1>15 Puzzle</h1>
            </div>
            <p class="subtitle">Slide the tiles to arrange them in order</p>
        </header>

        <!-- Difficulty Levels -->
        <div class="level-selector" id="level-selector">
            <button class="level-btn" data-size="3">Easy (3×3)</button>
            <button class="level-btn active" data-size="4">Medium (4×4)</button>
            <button class="level-btn" data-size="5">Hard (5×5)</button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-info">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="move-count">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-info">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-info">
                    <span class="stat-label">Best</span>
                    <span class="stat-value" id="best-score">—</span>
                </div>
            </div>
        </div>

        <!-- Puzzle Board -->
        <div class="board-wrapper">
            <div class="puzzle-board" id="puzzle-board">
                <!-- Tiles are rendered by JavaScript -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="new-game-btn">
                <span class="btn-icon">🔄</span>
                New Game
            </button>
            <button class="btn btn-secondary" id="hint-btn">
                <span class="btn-icon">💡</span>
                Get Hint
            </button>
            <button class="btn btn-secondary" id="auto-solve-btn">
                <span class="btn-icon">🤖</span>
                Auto Solve
            </button>
        </div>
        <p class="subtitle hint-text">💡 <strong>Controls:</strong> Click adjacent tiles, swipe, or use <strong>Arrow Keys / WASD</strong> to slide easily!</p>
    </div>

    <!-- Win Celebration Modal -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-card">
            <div class="confetti-container" id="confetti-container"></div>
            <div class="modal-emoji">🎉</div>
            <h2 class="modal-title">Puzzle Solved!</h2>
            <p class="modal-subtitle">Incredible work!</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="modal-stat-label">Moves</span>
                    <span class="modal-stat-value" id="win-moves">0</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-label">Time</span>
                    <span class="modal-stat-value" id="win-time">00:00</span>
                </div>
            </div>
            <div class="modal-badge" id="new-best-badge" style="display:none;">
                ⭐ New Best Score!
            </div>
            <button class="btn btn-primary btn-lg" id="play-again-btn">
                <span class="btn-icon">🔄</span>
                Play Again
            </button>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
